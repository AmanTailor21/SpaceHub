name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    php:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  extensions: pdo_sqlite, zip
                  coverage: none
            - uses: ramsey/composer-install@v3
            - run: composer lint
            - run: composer analyse
            - run: composer test

    frontend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm
            - run: npm ci
            - run: npm run format:frontend:check
            - run: npm run build
